<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프레젠테이션 대시보드</title>
<style>
    :root {
        --bg: #1c1c1e;
        --panel: #1c1c1e;
        --border: #6e6e73;
        --border-soft: #48484a;
        --text: #f5f5f7;
        --text-dim: #9a9a9e;
        --tab-active-bg: #ffffff;
        --tab-active-text: #1c1c1e;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
        padding: 28px 24px 40px;
    }

    /* ---------- 비밀번호 화면 ---------- */
    #auth-loading {
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 12px;
    }
    #auth-loading h1 { font-size: 22px; margin: 0; }
    #auth-loading p { color: var(--text-dim); font-size: 15px; margin: 0; }

    /* ---------- 메인 대시보드 ---------- */
    #protected-menu { display: none; max-width: 960px; margin: 0 auto; }

    .list-label {
        font-size: 15px;
        color: var(--text-dim);
        margin: 0 0 14px 2px;
    }

    .tab-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
    }

    .tab-btn {
        appearance: none;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        border-radius: 10px;
        padding: 12px 18px;
        font-size: 15px;
        line-height: 1.3;
        font-family: inherit;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        white-space: pre-line;
        text-align: center;
    }

    .tab-btn:hover {
        border-color: #ffffff;
    }

    .tab-btn.active {
        background-color: var(--tab-active-bg);
        color: var(--tab-active-text);
        border-color: var(--tab-active-bg);
        font-weight: 600;
    }

    .content-panel {
        border: 1px solid var(--border);
        border-radius: 22px;
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
    }

    .content-panel.has-frame {
        align-items: stretch;
        justify-content: stretch;
    }

    .placeholder {
        color: var(--text-dim);
        font-size: 16px;
    }

    .content-panel iframe {
        width: 100%;
        height: 100%;
        min-height: 60vh;
        border: none;
        border-radius: 22px;
        background: #ffffff;
    }

    @media (max-width: 600px) {
        .tab-btn { flex: 1 1 auto; font-size: 14px; padding: 10px 12px; }
        .content-panel, .content-panel iframe { min-height: 50vh; }
    }
</style>
</head>
<body>

    <!-- 암호 입력 전 대기 화면 -->
    <div id="auth-loading">
        <h1>🔒 비밀번호로 보호된 페이지입니다.</h1>
        <p>암호 인증 진행 중...</p>
    </div>

    <!-- 🔑 암호 인증에 성공하면 나타나는 대시보드 -->
    <div id="protected-menu">
        <p class="list-label">List</p>

        <div class="tab-row" id="tab-row">
            <!-- 버튼은 JS에서 동적으로 생성됩니다 -->
        </div>

        <div class="content-panel" id="content-panel">
            <p class="placeholder" id="placeholder-text">내용 표기</p>
            <iframe id="content-frame" style="display:none;"></iframe>
        </div>
    </div>

<script>
    // 탭 목록: label(버튼 문구), url(내용), type(dashboard: 안내문 표시 / link: iframe 표시)
    const TABS = [
        { label: "대쉬보드", type: "dashboard" },
        { label: "Today", type: "link", url: "https://script.google.com/macros/s/AKfycbyAYZedvxzICF7HxMud5tCLk9ccRXQMahJX__xQUoNzJdnEaiPG7GLJGNo1fCKlQRqZ_Q/exec" },
        { label: "자산배분\n전략", type: "link", url: "aaa.html" },
        { label: "각 계좌별\n운용", type: "link", url: "bbb.html" },
        { label: "연도별\n백테스트", type: "link", url: "ccc.html" },
        { label: "적립\n시뮬레이터", type: "link", url: "ddd.html" },
        { label: "운용\n시뮬레이션", type: "link", url: "eee.html" },
        { label: "Gemini", type: "link", url: "https://script.google.com/macros/s/AKfycbx7sH9o3tqaPIgvkA6kqWZhvVGkcTgn_uSTI2l7aCh80J_-iCroVVKSvN3w8ZwcKqFP/exec" }
    ];

    const tabRow = document.getElementById("tab-row");
    const panel = document.getElementById("content-panel");
    const placeholder = document.getElementById("placeholder-text");
    const frame = document.getElementById("content-frame");

    function selectTab(index) {
        // 버튼 활성화 스타일 갱신
        document.querySelectorAll(".tab-btn").forEach((btn, i) => {
            btn.classList.toggle("active", i === index);
        });

        const tab = TABS[index];

        if (tab.type === "dashboard") {
            frame.style.display = "none";
            frame.src = "";
            panel.classList.remove("has-frame");
            placeholder.style.display = "block";
            placeholder.textContent = "내용 표기";
        } else {
            placeholder.style.display = "none";
            panel.classList.add("has-frame");
            frame.style.display = "block";
            frame.src = tab.url;
        }
    }

    // 탭 버튼 생성
    TABS.forEach((tab, i) => {
        const btn = document.createElement("button");
        btn.className = "tab-btn";
        btn.textContent = tab.label;
        btn.addEventListener("click", () => selectTab(i));
        tabRow.appendChild(btn);
    });

    window.onload = function () {
        const MY_PASSWORD = "5";

        let passwordInput = prompt("프레젠테이션 목록을 보려면 비밀번호를 입력하세요:");
        if (passwordInput === MY_PASSWORD) {
            document.getElementById("auth-loading").style.display = "none";
            document.getElementById("protected-menu").style.display = "block";
            selectTab(0); // 기본으로 대쉬보드 탭 표시
        } else {
            alert("비밀번호가 올바르지 않습니다.");
            window.location.reload();
        }
    };
</script>
</body>
</html>
