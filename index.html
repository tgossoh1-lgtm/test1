<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프레젠테이션 대시보드</title>
<style>
    :root {
        --header-bg: #0e1a2b;
        --header-border: #1f3350;
        --bg: #10141a;
        --panel-bg: #151b24;
        --border: #2a323e;
        --border-soft: #3a4350;
        --text: #f3f5f7;
        --text-dim: #8b95a3;
        --accent-red: #e0344c;
        --accent-red-soft: rgba(224,52,76,0.14);
        --tab-active-bg: #1c2733;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    }

    /* ---------- 비밀번호 화면 ---------- */
    #auth-loading {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 12px;
    }
    #auth-loading h1 { font-size: 22px; margin: 0; }
    #auth-loading p { color: var(--text-dim); font-size: 15px; margin: 0; }

    /* ---------- 상단 헤더 ---------- */
    #protected-menu { display: none; }

    .top-header {
        background: linear-gradient(180deg, var(--header-bg), #0b1522);
        border-bottom: 1px solid var(--header-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 14px 28px;
        flex-wrap: wrap;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: linear-gradient(135deg, #3b6bd6, #6a3bd6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        color: #fff;
        flex-shrink: 0;
    }

    .brand-title-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
    }

    .brand-title {
        font-size: 17px;
        font-weight: 700;
        color: var(--text);
    }

    .brand-year-badge {
        background: #2a3f61;
        color: #cfe0ff;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 5px;
    }

    .brand-sub {
        font-size: 12.5px;
        color: var(--text-dim);
        margin-top: 2px;
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    .status-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        color: var(--text-dim);
        background: #16202f;
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 8px;
    }
    .status-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: #35d17a;
        flex-shrink: 0;
    }

    .lang-toggle {
        display: flex;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
    }
    .lang-toggle button {
        border: none;
        background: transparent;
        color: var(--text-dim);
        font-size: 12.5px;
        font-weight: 600;
        padding: 7px 12px;
        cursor: pointer;
    }
    .lang-toggle button.active {
        background: var(--accent-red);
        color: #fff;
    }

    .header-btn {
        border: 1px solid var(--border);
        background: #16202f;
        color: var(--text);
        font-size: 12.5px;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        white-space: nowrap;
    }
    .header-btn.primary {
        background: var(--accent-red);
        border-color: var(--accent-red);
        color: #fff;
    }
    .header-btn:hover { border-color: var(--text-dim); }

    /* ---------- 탭 네비게이션 ---------- */
    .tab-nav {
        background: #0c1420;
        border-bottom: 1px solid var(--header-border);
        display: flex;
        gap: 4px;
        padding: 0 20px;
        overflow-x: auto;
    }

    .tab-btn {
        appearance: none;
        border: none;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--text-dim);
        padding: 13px 16px;
        font-size: 13.5px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
        transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .tab-btn .tab-icon { font-size: 15px; }

    .tab-btn:hover {
        color: var(--text);
        background: rgba(255,255,255,0.03);
    }

    .tab-btn.active {
        color: var(--text);
        background: var(--tab-active-bg);
        border-bottom-color: var(--accent-red);
    }

    .tab-badge {
        background: var(--accent-red-soft);
        color: #ff8a9a;
        font-size: 10.5px;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 4px;
    }

    /* ---------- 콘텐츠 영역 ---------- */
    .content-area {
        padding: 20px;
    }

    .content-panel {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--panel-bg);
        min-height: 78vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
    }

    .content-panel.has-frame {
        align-items: stretch;
        justify-content: stretch;
    }

    .placeholder {
        color: var(--text-dim);
        font-size: 16px;
    }

    .content-panel iframe {
        width: 100%;
        height: 100%;
        min-height: 78vh;
        border: none;
        background: #ffffff;
    }

    @media (max-width: 700px) {
        .top-header { padding: 12px 16px; }
        .brand-title { font-size: 15px; }
        .header-right { gap: 6px; }
        .status-chip { display: none; }
        .content-area { padding: 12px; }
        .content-panel, .content-panel iframe { min-height: 65vh; }
    }
</style>
</head>
<body>

    <!-- 암호 입력 전 대기 화면 -->
    <div id="auth-loading">
        <h1>🔒 비밀번호로 보호된 페이지입니다.</h1>
        <p>암호 인증 진행 중...</p>
    </div>

    <!-- 🔑 암호 인증에 성공하면 나타나는 대시보드 -->
    <div id="protected-menu">

        <div class="top-header">
            <div class="brand">
                <div class="brand-mark">P</div>
                <div>
                    <div class="brand-title-row">
                        <span class="brand-title">자산관리 종합 대시보드</span>
                        <span class="brand-year-badge">2026</span>
                    </div>
                    <div class="brand-sub">Portfolio Ops Dashboard</div>
                </div>
            </div>

            <div class="header-right">
                <div class="status-chip">
                    <span class="status-dot"></span>
                    <span id="update-time">최신 갱신 기준</span>
                </div>
                <div class="lang-toggle">
                    <button class="active" type="button">KO</button>
                    <button type="button">EN</button>
                </div>
                <button class="header-btn" type="button">용어 사전</button>
                <button class="header-btn primary" type="button">데이터 업데이트</button>
            </div>
        </div>

        <div class="tab-nav" id="tab-row">
            <!-- 버튼은 JS에서 동적으로 생성됩니다 -->
        </div>

        <div class="content-area">
            <div class="content-panel" id="content-panel">
                <p class="placeholder" id="placeholder-text">내용 표기</p>
                <iframe id="content-frame" style="display:none;"></iframe>
            </div>
        </div>
    </div>

<script>
    // 탭 목록: label(버튼 문구), icon, url(내용), type(dashboard: 안내문 표시 / link: iframe 표시), badge(선택)
    const TABS = [
        { label: "Home", icon: "", type: "dashboard"},
        { label: "대쉬보드", icon: "🏠", type: "link", url: "https://script.google.com/macros/s/AKfycbw4HbXpXOobjCVK05G6aB5V8_wYE-PTV2lS1HLehNwlm4y7-RruFTI1z6kdQg34Mm_c/exec" },
        { label: "Today", icon: "⚡", type: "link", url: "https://script.google.com/macros/s/AKfycbyAYZedvxzICF7HxMud5tCLk9ccRXQMahJX__xQUoNzJdnEaiPG7GLJGNo1fCKlQRqZ_Q/exec", badge: "오늘" },
        { label: "자산배분 전략", icon: "📊", type: "link", url: "aaa.html" },
        { label: "각 계좌별 운용", icon: "💼", type: "link", url: "bbb.html" },
        { label: "연도별 백테스트", icon: "📈", type: "link", url: "ccc.html" },
        { label: "적립 시뮬레이터", icon: "🧮", type: "link", url: "ddd.html" },
        { label: "운용 시뮬레이션", icon: "🎯", type: "link", url: "eee.html" },
        { label: "Gemini", icon: "✨", type: "link", url: "https://script.google.com/macros/s/AKfycbx7sH9o3tqaPIgvkA6kqWZhvVGkcTgn_uSTI2l7aCh80J_-iCroVVKSvN3w8ZwcKqFP/exec" }
    ];

    const tabRow = document.getElementById("tab-row");
    const panel = document.getElementById("content-panel");
    const placeholder = document.getElementById("placeholder-text");
    const frame = document.getElementById("content-frame");

    function selectTab(index) {
        document.querySelectorAll(".tab-btn").forEach((btn, i) => {
            btn.classList.toggle("active", i === index);
        });

        const tab = TABS[index];

        if (tab.type === "dashboard") {
            frame.style.display = "none";
            frame.src = "";
            panel.classList.remove("has-frame");
            placeholder.style.display = "block";
            placeholder.textContent = "내용 표기";
        } else {
            placeholder.style.display = "none";
            panel.classList.add("has-frame");
            frame.style.display = "block";
            frame.src = tab.url;
        }
    }

    // 탭 버튼 생성
    TABS.forEach((tab, i) => {
        const btn = document.createElement("button");
        btn.className = "tab-btn";
        btn.innerHTML =
            '<span class="tab-icon">' + tab.icon + '</span><span>' + tab.label + '</span>' +
            (tab.badge ? '<span class="tab-badge">' + tab.badge + '</span>' : '');
        btn.addEventListener("click", () => selectTab(i));
        tabRow.appendChild(btn);
    });

    // 갱신 시각 표시 (오늘 날짜 기준)
    (function setUpdateTime() {
        const el = document.getElementById("update-time");
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, "0");
        const d = String(now.getDate()).padStart(2, "0");
        el.textContent = "최신 갱신: " + y + "." + m + "." + d;
    })();

    window.onload = function () {
        const MY_PASSWORD = "5";

        let passwordInput = prompt("프레젠테이션 목록을 보려면 비밀번호를 입력하세요:");
        if (passwordInput === MY_PASSWORD) {
            document.getElementById("auth-loading").style.display = "none";
            document.getElementById("protected-menu").style.display = "block";
            selectTab(0); // 기본으로 대쉬보드 탭 표시
        } else {
            alert("비밀번호가 올바르지 않습니다.");
            window.location.reload();
        }
    };
</script>
</body>
</html>
